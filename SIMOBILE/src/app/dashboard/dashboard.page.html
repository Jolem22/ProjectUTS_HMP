<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title> Dashboard </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Dashboard</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Jumlah produk & jumlah transaksi -->
  
  <ion-grid class="grid-ringkasan">
    <ion-row>
        <ion-col size="6">
          <ion-card class="kartu-ringkasan">
            <ion-card-header> 
              <ion-card-title>
                <ion-icon name="receipt-outline"></ion-icon> Transaksi Hari Ini
              </ion-card-title>
              <ion-card-subtitle>Tanggal hari ini</ion-card-subtitle>
            </ion-card-header>
            <ion-card-content>              
              <ion-accordion-group expand="inset">
                <ion-accordion *ngFor="let t of transaksiList" [value]="t.id">

                  <ion-item slot="header">
                    <ion-label>Transaksi {{t.nomor}}</ion-label>
                  </ion-item>

                  <div class="ion-padding" slot="content">
                    <ion-item lines="none" *ngFor="let item of t.items">
                      <ion-label>{{getNama(item.produkId)}}</ion-label>
                      <ion-text slot="end">{{item.jumlah}} x {{rupiah(getHarga(item.produkId))}}</ion-text>
                    </ion-item>

                    <hr>

                    <ion-item lines="none">
                      <ion-label>Total Transaksi:</ion-label>
                      <ion-text slot="end"><b>{{rupiah(hitungTotal(t))}}</b></ion-text>
                    </ion-item>
                  </div>

                </ion-accordion>
              </ion-accordion-group>
            </ion-card-content>
          </ion-card>
        </ion-col>

        <ion-col size="6">
          <ion-card class="kartu-ringkasan">
            <ion-card-header>
              <ion-card-title>
                <ion-icon name="cube-outline"></ion-icon> Produk Terlaris
              </ion-card-title>
            </ion-card-header>
            <ion-card-content>

              <div>
                <ion-item lines="none" *ngFor="let p of produkTerlaris; let i = index">
                  <ion-label>{{i + 1}}. {{p.nama}}</ion-label>
                  <ion-text slot="end">{{p.total}} terjual</ion-text>
                </ion-item>
              </div>
              
            </ion-card-content>
          </ion-card>
        </ion-col> 
      </ion-row>
  </ion-grid>
</ion-content>
